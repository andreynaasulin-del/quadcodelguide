let scroll=0, scrollV=0, lastScroll=0, target=0, index=0;
let T=0, u=0, effort=0, effortS=0, tugPulse=0;
let gust=0.34, gustTarget=0.34, nextGust=2;
let blinkAt=1.6, blink=0, earTwitch=0, nextTwitch=3;
let sweatTimer=0, foreheadAbs={x:150,y:100};
let haulTravel=0, slackPay=0;                 // rope that has run through her hands
let leanS=0, leanV=0, headLag=0;               // posture spring, and the head trailing it
let bob=0, bobV=0;                             // head nod, driven by the beat
const gripS={Left:0, Right:0};                 // how closed each fist is
const footOff={Left:0, Right:0};               // per-foot re-brace offset
let footDrift=0;
const STEP={active:false, side:"Right", t:0, from:0, to:0};
let fistW={x:0,y:0}, fistBackW={x:0,y:0}, fistHi={x:0,y:0,z:0}, fistLo={x:0,y:0,z:0};
const drag={active:false,id:null,x0:0,scroll0:0,dx:0,lastX:0,lastT:0,vel:0,moved:false};

function goTo(i){ target=i*step; announce(i); }
function nudge(dir){ target+=dir*step; announce(Math.round(target/step)); }
function announce(i){
  const k=((i%DATA.length)+DATA.length)%DATA.length;
  statusEl.textContent = `${DATA[k].name}, ${DATA[k].role}: ${DATA[k].quote}`;
}
document.getElementById("prev").addEventListener("click", () => { nudge(-1); killHint(); });
document.getElementById("next").addEventListener("click", () => { nudge(1);  killHint(); });
stage.addEventListener("keydown", e => {
  if(e.key==="ArrowLeft"){ nudge(-1); killHint(); e.preventDefault(); }
  if(e.key==="ArrowRight"){ nudge(1);  killHint(); e.preventDefault(); }
});
function killHint(){ hintEl.classList.add("is-gone"); }
stage.addEventListener("pointerdown", e => {
  if(drag.active) return;
  drag.active=true; drag.id=e.pointerId;
  drag.x0=e.clientX; drag.scroll0=scroll; drag.dx=0; drag.moved=false;
  drag.lastX=e.clientX; drag.lastT=performance.now(); drag.vel=0;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if(!drag.active || e.pointerId!==drag.id) return;
  drag.dx=e.clientX-drag.x0;
  if(Math.abs(drag.dx)>4){ drag.moved=true; killHint(); }
  const now=performance.now(), dt=Math.max(8, now-drag.lastT);
  drag.vel=(e.clientX-drag.lastX)/dt*1000;
  drag.lastX=e.clientX; drag.lastT=now;
  scroll=drag.scroll0-drag.dx;
  target=scroll;
});
function endDrag(e){
  if(!drag.active || (e && e.pointerId!==drag.id)) return;
  drag.active=false;
  const frac=-drag.dx/step;
  let i=Math.round(drag.scroll0/step);
  if(Math.abs(drag.vel)>CFG.motion.flickThreshold) i += drag.vel<0 ? 1 : -1;
  else if(Math.abs(frac)>CFG.motion.dragThreshold)  i += frac>0 ? 1 : -1;
  target=i*step;
  announce(i);
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* =====================================================================
   POSE — how a person actually hauls a rope
   =====================================================================
   One stroke: reach out along the rope, close the grip, drive with the legs while the
   torso rotates back over the hips, then release and reach again. The two hands are half
   a cycle apart, so one is always loaded. Effort deepens the crouch, the lean and the
   speed of it all. */
/* scratch vectors, reused every frame */
const _gT=new THREE.Vector3(), _pole=new THREE.Vector3(), _axis=new THREE.Vector3(0,0,1);

function handStroke(phase){
  const p=((phase%1)+1)%1, pullEnd=0.72;   // reference keeps both hands on the line
  if(p<pullEnd){
    /* loaded: the fist travels down and back along the rope, past the ribs to the far hip.
       A beat of anticipation first — the hand settles further out before it drives. */
    const k=easeIO(p/pullEnd);
    const anticip = Math.sin(Math.min(p/0.13,1)*Math.PI)*0.06;
    return { s: clamp(k - anticip, 0, 1.05), out:0, grip:1, drive:Math.sin(Math.PI*(p/pullEnd)) };
  }
  /* recovery: off the rope, swung out away from the chest and back up to the catch */
  const k=easeIO((p-pullEnd)/(1-pullEnd));
  return { s: 1-k, out: Math.sin(Math.PI*k), grip:0, drive:0 };
}

function poseHuman(dt){
  const B=HUMAN.B, R=HUMAN.rest, grip=gripPoint;

  /* posture runs on a spring rather than straight off effort, so releasing a haul lets the
     body ride past its mark and settle instead of stopping dead (follow-through) */
  leanV += ((effortS - leanS)*CFG.human.leanK - leanV*CFG.human.leanC)*dt;
  leanS = clamp(leanS + leanV*dt, 0, 1.4);
  const E = leanS;
  const idle = 1 - clamp(effortS*3.5, 0, 1);
  headLag = lerp(headLag, leanS, 1-Math.pow(0.02, dt));

  /* Nodding to whatever is in her headphones — and not only the head: the chest counters
     the nod, the hips drop a little on the beat and the knees take it, which is what stops
     it reading as a bobblehead. Damped down while the rope is actually loaded. */
  /* bass energy carries a beat far better than overall level, which sits low */
  const groove = clamp(AUDIO.level*5.5 + AUDIO.bass*0.55, 0, 1) * (0.35 + 0.65*idle);
  /* one clean nod per beat, shaped by where we are inside the beat rather than by an
     impulse train: down fast on the beat, lifting again by the next one */
  const ph = AUDIO.playing ? AUDIO.phase : 0;
  const nod = AUDIO.playing ? Math.pow(Math.max(0, Math.sin(Math.PI*(0.10 + 0.9*ph))), 1.6) : 0;
  bobV += (nod*1.25 - bob)*54*dt - bobV*9.5*dt;
  bob  += bobV*dt;
  const bobA = bob*groove*(reduced ? 0.2 : 1);


  /* direction of the rope, away from him */
  let hx=anchorR.x-grip.x, hy=anchorR.y-grip.y;
  const hlen=Math.hypot(hx,hy)||1, rdx=hx/hlen, rdy=hy/hlen;

  const A=handStroke(u), Bs=handStroke(u+0.5);
  const stroke=Math.max(A.drive,Bs.drive);
  const decay = 1-Math.pow(CFG.human.gripK, dt);
  /* a hand only opens while it is actually mid-recovery; standing there holding the line,
     both fists are shut */
  const hauling = clamp(effortS*4, 0, 1);
  gripS.Left  = lerp(gripS.Left,  Math.max(A.grip,  1-hauling), decay);
  gripS.Right = lerp(gripS.Right, Math.max(Bs.grip, 1-hauling), decay);
  setGrip("Left",  0.25 + 0.75*gripS.Left);
  setGrip("Right", 0.25 + 0.75*gripS.Right);
  const reach = HUMAN.reach;                       // px his arms can span

  /* The rope is gripped on a diagonal across the body, the way it is actually done: the
     leading fist high in front of the sternum where the taut line arrives, the trailing fist
     low and back by the opposite hip, with the slack falling away from it. Each hand hauls
     down that diagonal, lets go, and swings back out to the catch. */
  const gripLow = { x: grip.x - reach*0.26, y: grip.y + reach*0.52 };
  const along = (st) => ({ x: lerp(grip.x, gripLow.x, st), y: lerp(grip.y, gripLow.y, st) });
  const gA = along(A.s),  gB = along(Bs.s);
  gA.out = A.out; gB.out = Bs.out;
  gA.st = A.s;   gB.st = Bs.s;
  /* the recovery swing goes outward, toward the viewer and a little forward */
  gA.x += A.out*reach*0.10;  gA.y -= A.out*reach*0.06;
  gB.x += Bs.out*reach*0.10; gB.y -= Bs.out*reach*0.06;

  for(const k of ["Hips","Spine","Spine1","Spine2","Neck","Head",
                  "LeftShoulder","LeftArm","LeftForeArm","LeftHand",
                  "RightShoulder","RightArm","RightForeArm","RightHand",
                  "LeftUpLeg","LeftLeg","LeftFoot","RightUpLeg","RightLeg","RightFoot"]){
    if(B[k]) B[k].quaternion.copy(R[k]);
  }

  /* --- hips: drop and travel back on the drive, recover between strokes --- */
  const load = clamp(0.30 + 0.70*stroke, 0, 1) * (0.42 + 0.58*E);
  const hipUnit = Math.abs(HUMAN.restHip.y) || 1;  // bone units, whatever the rig uses
  B.Hips.position.copy(HUMAN.restHip);
  /* she is never inert: between hauls the weight rocks slowly foot to foot and she breathes */
  B.Hips.position.x += hipUnit * 0.035 * idle * Math.sin(T*0.55);
  B.Hips.position.y += hipUnit * 0.008 * idle * Math.sin(T*1.5);
  B.Hips.position.y -= hipUnit * 0.020 * bobA;                     // the beat lands in the knees
  B.Hips.position.x += hipUnit * 0.016 * bobA * Math.sin(T*1.55);
  B.Hips.position.z -= hipUnit * HUMAN.hipBack * load;   // model faces +Z, so back is -Z
  B.Hips.position.y -= hipUnit * HUMAN.hipDrop * load;
  B.Hips.quaternion.copy(R.Hips)
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), 0.34*load));

  /* --- spine: the lean is spread over three joints, plus a little counter-twist --- */
  /* shoulders travel back over tucked hips — the posture you actually take on a rope */
  const leanEach = -(0.16 + 0.30*E)*(0.4+0.6*stroke);   // reference sits much deeper
  const breath = Math.sin(T*1.5)*0.022*idle + bobA*0.05;
  for(const [k,w] of [["Spine",1.0],["Spine1",0.85],["Spine2",0.6]]){
    if(!B[k]) continue;
    B[k].quaternion.copy(R[k])
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), breath*w))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), leanEach*w))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), 0.06*w*(1-stroke)))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), -bobA*0.13*w))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), Math.sin(T*1.55)*0.05*groove*w));
  }
  /* head stays on the rope, chin tucking as he strains */
  if(B.Neck) B.Neck.quaternion.copy(R.Neck)
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), 0.16+0.22*load + bobA*0.30))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), Math.sin(T*3.1)*0.05*groove));
  if(B.Head) B.Head.quaternion.copy(R.Head)
    /* the head lags the chest by a beat instead of moving as one rigid piece */
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), 0.10+0.12*headLag))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), bobA*0.34))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), 0.05*idle*Math.sin(T*0.4) + Math.sin(T*1.55)*0.07*groove));

  HUMAN.root.updateMatrixWorld(true);

  /* --- arms: solved so the PALM lands on the rope, not the wrist --- */
  captureBind(["LeftArm","LeftForeArm","LeftHand","RightArm","RightForeArm","RightHand"]);
  captureHandBind();
  const armZ = 40;
  const dgx = gripLow.x-grip.x, dgy = gripLow.y-grip.y;
  const dgl = Math.hypot(dgx,dgy)||1;
  const ropeDirW = HAND.w.set(dgx/dgl, -dgy/dgl, 0.16).normalize();
  if(HAND.ready) for(const [side, g] of [["Left", gA], ["Right", gB]]){
    const hand=B[side+"Hand"];
    if(!hand || !HUMAN.bind[side+"Arm"]) continue;
    const zOut = armZ + (side==="Left" ? 20 : -16) + g.st*46 + g.out*18;
    g.z = zOut;
    /* where the rope should sit in the palm */
    handGripQuat(side, ropeDirW, HAND.q);
    /* wrist target = palm target pulled back along the fingers axis by a hand length */
    HAND.v.copy(HAND.xL[side]).applyQuaternion(HAND.q).multiplyScalar(HAND.palm[side]);
    _gT.set(vx(g.x) - HAND.v.x, vy(g.y) - HAND.v.y, zOut - HAND.v.z);
    /* elbow drives down and back past the ribs, swinging out on the recovery */
    _pole.set(-(1.0 - 0.5*g.out), -0.75, -0.35 + g.out*1.1).normalize();
    solveLimb(side+"Arm", side+"ForeArm", side+"Hand", _gT, _pole, 0);
    setBoneWorldQuat(hand, HAND.q);
  }

  /* --- legs: IK onto planted feet, so the knees absorb the hip drop --- */
  const fY = humanGroundY;

  /* Under tension the planted feet are dragged toward the rope; past a threshold she lifts
     the trailing foot and re-braces. The two feet alternate, so she holds her ground over a
     long haul instead of either sliding out of frame or staying welded to two spots. */
  footDrift = Math.min(CFG.human.maxDrift, footDrift + effortS*CFG.human.driftPerTension*dt);
  if(!STEP.active && footDrift - Math.min(footOff.Left, footOff.Right) > CFG.human.maxDrift*0.7){
    STEP.active = true;
    STEP.t = 0;
    STEP.side = STEP.side === "Left" ? "Right" : "Left";
    STEP.from = footOff[STEP.side];
    STEP.to   = footDrift;
  }
  let stepLift = 0;
  if(STEP.active){
    STEP.t += dt/CFG.human.stepDur;
    const k = clamp(STEP.t, 0, 1);
    footOff[STEP.side] = lerp(STEP.from, STEP.to, easeIO(k));
    stepLift = Math.sin(Math.PI*k)*CFG.human.stepLift;
    if(STEP.t >= 1){
      STEP.active = false;
      const m = Math.min(footOff.Left, footOff.Right);   // both re-braced: rebase, no creep
      if(m > 0){ footOff.Left -= m; footOff.Right -= m; footDrift -= m; }
    }
  }

  const plant = {
    Left : { x: humanX + HUMAN.stanceFront + footDrift - footOff.Left,  y: fY - (STEP.active&&STEP.side==="Left"  ? stepLift : 0) },
    Right: { x: humanX - HUMAN.stanceBack  + footDrift - footOff.Right, y: fY - (STEP.active&&STEP.side==="Right" ? stepLift : 0) },
  };

  captureBind(["LeftUpLeg","LeftLeg","LeftFoot","RightUpLeg","RightLeg","RightFoot"]);
  for(const side of ["Left","Right"]){
    if(!B[side+"UpLeg"]) continue;
    const pt=plant[side], front = side==="Left";
    _gT.set(vx(pt.x), vy(pt.y), (front ? 30 : -34));
    /* knees break forward, toward the rope she is pulling against */
    _pole.set(1, front ? 0.25 : 0.05, front ? 0.5 : 0.2).normalize();
    const lift = STEP.active && STEP.side===side ? 0.5 : 0;
    solveLimb(side+"UpLeg", side+"Leg", side+"Foot", _gT, _pole, 0.92 - lift*0.6);
  }

  /* --- a loaded fist visibly bends the line into it --- */
  for(const [g, gp] of [[gA, A.grip], [gB, Bs.grip]]){
    if(gp < 0.35) continue;
    const sArc = (g.x - anchorL.x) * lenRatio;
    if(sArc < 14 || sArc > rope.cum[rope.cum.length-1]-14) continue;
    const loc = atLength(sArc);
    addForceAt(loc, 0, (g.y - loc.y) * CFG.human.ropeBend * gp);
  }

  /* --- the rope end gets yanked toward him on every stroke --- */
  tugPulse = stroke*E;
  const yank = CFG.rope.tugAmp*tugPulse;
  anchorL.x = anchorBase.x - rdx*yank;
  anchorL.y = anchorBase.y - rdy*yank;

  /* whichever fist is loaded owns where the free end bends */
  /* the loose end threads through BOTH fists in order — high one first, then the low one,
     then away — which is what makes the grip read as a grip */
  const lo = A.s >= Bs.s ? gA : gB, hi = A.s >= Bs.s ? gB : gA;
  fistHi.x = hi.x; fistHi.y = hi.y; fistHi.z = hi.z || 0;
  fistLo.x = lo.x; fistLo.y = lo.y; fistLo.z = lo.z || 0;
  fistW.x = hi.x;  fistW.y = hi.y;

  /* sweat off the brow */
  if(!reduced && B.Head){
    const hp = bonePos(B.Head, IK.v0);
    foreheadAbs = { x: hp.x + W/2, y: H/2 - hp.y };
    sweatTimer -= dt;
    if(E>0.42 && sweatTimer<=0){ sweatTimer=lerp(0.26,0.11,E); spawnSweat(E); }
  }
}

function spawnSweat(E){
  const d=sweat.find(s=>s.life<=0); if(!d) return;
  const sc = HUMAN.scale*100;
  d.x=foreheadAbs.x+(Math.random()*12-6);
  d.y=foreheadAbs.y-6+(Math.random()*8-4);
  d.z=40+Math.random()*30;
  d.vx=(60+Math.random()*110)*(0.6+E);
  d.vy=(-110-Math.random()*130)*(0.6+E);
  d.life=0.8+Math.random()*0.4;
  d.r=2.6+Math.random()*1.6;
  d.m.visible=true;
}
function stepParticles(dt){
  for(const d of sweat){
    if(d.life<=0){ if(d.m.visible) d.m.visible=false; continue; }
    d.life-=dt; d.vy+=1000*dt;
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    d.mat.opacity=0.92*clamp(d.life*1.5,0,1);
    const stretch=clamp(1+Math.abs(d.vy)/900,1,1.8);
    d.m.position.set(vx(d.x), vy(d.y), d.z);
    d.m.scale.set(d.r, d.r*stretch, d.r);
    d.m.rotation.z=-Math.atan2(d.vy,d.vx)-Math.PI/2;
  }
}

/* =====================================================================
   CLOTH: hang each card off the line, blow wind through it
   ===================================================================== */
function placeCards(dt){
  const total=DATA.length*step;
  /* wind energy: ambient gust plus whatever Jerry is putting into the line */
  const windE=clamp(0.34 + gust*0.7 + effortS*0.8, 0, 1.35);  // always a live breeze

  for(let ci=0; ci<cards.length; ci++){
    const c=cards[ci];
    const k=Math.round((scroll-ci*step)/total);
    const sMid=s0+(ci*step+k*total-scroll)*lenRatio;
    const half=span*0.5*lenRatio;
    const aL=atLength(sMid-half), aR=atLength(sMid+half);
    const midX=(aL.x+aR.x)/2;

    if(midX < -cardW*1.15 || midX > W+cardW*1.4){
      if(c.visible){ c.visible=false; c.mesh.visible=false; c.threadL.visible=c.threadR.visible=false; c.ringL.visible=c.ringR.visible=false; }
      c.pmx=midX; continue;
    }
    if(!c.visible){ c.visible=true; c.mesh.visible=true; c.threadL.visible=c.threadR.visible=true; c.ringL.visible=c.ringR.visible=true; c.pmx=midX; c.theta=0; c.thetaV=0; }

    const ropeAng=Math.atan2(aR.y-aL.y, aR.x-aL.x);

    /* both loops swing together, so the threads stay parallel */
    const vxx=(midX-c.pmx)/dt, acc=(vxx-c.pvx)/dt;
    c.pvx=vxx; c.pmx=midX;
    if(!reduced){
      const windTorque=gust*2.6*(0.7+0.5*Math.sin(T*1.9+c.phase));
      c.thetaV += (-CFG.card.swingK*c.theta - CFG.card.swingDamp*c.thetaV
                   - acc*CFG.card.swingInertia + windTorque)*dt;
      c.theta=clamp(c.theta+c.thetaV*dt, -CFG.card.maxSwing, CFG.card.maxSwing);
    } else c.theta=0;

    const downAng=ropeAng*0.55+Math.PI/2+c.theta;
    const dnx=Math.cos(downAng), dny=Math.sin(downAng);   // "down" for this card
    const sdx=-dny, sdy=dnx;                              // along its width

    /* cloth vertices: u across the width, v down from the pinned top edge */
    const cl=c.cloth, pos=cl.geo.attributes.position.array;
    /* amplitude and ripple count come off the card's width, not its height: a tall narrow
       phone card gets the same gentle billow instead of a shredded one */
    const amp=Math.min(cardH*CFG.card.waveAmp, cardW*0.085)*clamp(windE,0,1.6);
    const lenU=clamp(3.2*(cardW/cardH), 5, CFG.card.waveLenU);
    const ph0=T*CFG.card.waveSpeed+c.phase;
    const spanArc=span*lenRatio;
    for(let i=0;i<=cl.segX;i++){
      const uu=i/cl.segX;
      /* the top edge rides the actual rope curve between the two loops */
      const top=atLength(sMid-half+uu*spanArc);
      const uEnv=Math.sin(Math.PI*uu);                    // zero at the pinned corners
      for(let j=0;j<=cl.segY;j++){
        const vv=j/cl.segY;
        const dist=threadLen+vv*cardH;
        /* cloth hangs BACK from the line as it descends: physically right for laundry, and
           it keeps the sheet strictly behind the character's legs instead of through them */
        const rake = -CFG.card.rake*Math.pow(vv, 0.85);
        let px=top.x+dnx*dist, py=top.y+dny*dist, pz=0;
        if(!reduced){
          /* ramps away from the pinned top edge and corners, but never fully dies, so
             folds travel through the whole cloth instead of only the hem */
          const env=(0.12+0.88*Math.pow(vv,0.95))*(0.25+0.75*uEnv);
          const phase=ph0+uu*lenU-vv*CFG.card.waveLenV;
          const w1=Math.sin(phase), w2=Math.sin(phase*1.73+1.1);
          pz=amp*env*(w1*0.90+w2*0.34);
          /* billowing shortens the cloth in plane and lifts the free edge */
          /* in-plane billow: the cloth gathers sideways and its free edge rides up and
             down, which is what actually reads as wind from the front */
          const shrink=amp*0.26*env*Math.cos(phase);
          const rise  =amp*0.24*env*Math.sin(phase+0.9);
          px += sdx*shrink + dnx*(rise - Math.abs(pz)*0.16);
          py += sdy*shrink + dny*(rise - Math.abs(pz)*0.16);
          /* the bottom corners furl */
          const curl=CFG.card.curl*amp*Math.pow(vv,2.2)*(uu<0.5 ? (0.5-uu) : (uu-0.5))*2;
          pz += curl*Math.sin(ph0*0.7+uu*3.1);
        }
        const o=(j*cl.nx+i)*3;
        pos[o]=vx(px); pos[o+1]=vy(py); pos[o+2]=rake + Math.min(pz, vv>0.25 ? 0 : pz);
      }
    }
    cl.geo.attributes.position.needsUpdate=true;
    cl.geo.computeVertexNormals();

    /* card weight pulls the line down where it hangs */
    const wgt=CFG.card.weight;
    addForceAt(aL, dnx*wgt*0.5, dny*wgt);
    addForceAt(aR, dnx*wgt*0.5, dny*wgt);

    /* loops on the rope + threads down to the cloth's own top corners */
    const cornerL={ x:pos[0], y:pos[1], z:pos[2] };
    const cornerR={ x:pos[cl.segX*3], y:pos[cl.segX*3+1], z:pos[cl.segX*3+2] };
    setRing(c.ringL, aL); setRing(c.ringR, aR);
    setThread(c.threadL, aL, cornerL);
    setThread(c.threadR, aR, cornerR);
  }
}
function setRing(m, a){
  m.position.set(vx(a.x), vy(a.y), 0);
  m.rotation.set(0, Math.PI/2, -a.ang);
  m.scale.setScalar(Math.max(0.6, threadLen/22));
}
function setThread(g, a, corner){
  const ax=vx(a.x), ay=vy(a.y);
  const dx=corner.x-ax, dy=corner.y-ay;
  const len=Math.hypot(dx,dy)||1;
  g.position.set(ax, ay, corner.z*0.5);
  g.rotation.z=Math.atan2(dy,dx);
  g.scale.set(len/10, Math.max(0.5, threadLen/26), Math.max(0.5, threadLen/26));
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=performance.now(), acc=0, ready=false;
const FIXED=1/60;
window.__jerry = { rope, cards, CFG, HUMAN, AUDIO, rings,
  simStep: () => tick(FIXED),
  ropeStep: () => drawRope(),
  renderInfo: () => ({ triangles: renderer.info.render.triangles, calls: renderer.info.render.calls, programs: renderer.info.programs.length }),
  get state(){ return {ready,W,H,cardW,cardH,step,scroll,index,T,u,effort,effortS,gust,
    haulTravel,slackPay,leanS,gripL:gripS.Left,gripR:gripS.Right,footDrift,
    footOffL:footOff.Left,footOffR:footOff.Right,stepping:STEP.active,stepSide:STEP.side}; } };

function frame(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,1/20);
  requestAnimationFrame(frame);
  if(!ready || step<=0) return;
  acc+=dt;
  let steps=0;
  while(acc>=FIXED && steps<4){ tick(FIXED); acc-=FIXED; steps++; }
  drawRope();
  renderer.render(scene, camera);
}

function tick(dt){
  T+=dt;
  nextGust-=dt;
  if(nextGust<=0){ nextGust=1.6+Math.random()*3.2; gustTarget=0.22+Math.random()*0.62; }
  gust=lerp(gust, gustTarget, 1-Math.pow(0.001,dt));

  const prev=lastScroll;
  if(!drag.active && !reduced){
    const a=(target-scroll)*CFG.motion.springK - scrollV*CFG.motion.springDamp;
    scrollV+=a*dt; scroll+=scrollV*dt;
  } else if(!drag.active && reduced){
    scroll=lerp(scroll, target, 1-Math.pow(0.0005,dt));
    scrollV=(scroll-prev)/dt;
  } else scrollV=(scroll-prev)/dt;
  const dScroll=scroll-prev;
  lastScroll=scroll;

  const idx=((Math.round(scroll/step)%DATA.length)+DATA.length)%DATA.length;
  if(idx!==index){ index=idx; dots.forEach((d,i)=>d.setAttribute("aria-current", i===index?"true":"false")); }

  const speedE=clamp(Math.abs(scrollV)/(step*1.6),0,1);
  const holdE=drag.active ? clamp(Math.abs(drag.dx)/(step*0.55),0,1)*0.85 : 0;
  effort=Math.max(speedE, holdE);
  effortS=lerp(effortS, effort, 1-Math.pow(0.004,dt));

  haulTravel += dScroll*lenRatio;                       // rope run through her hands
  slackPay = Math.max(0, slackPay + Math.max(0,dScroll)*0.11 - slackPay*2.2*dt);
  slackPay = Math.min(slackPay, H*0.16);
  u += (dScroll/(step/CFG.motion.cyclesPerCard));
  u = ((u%1)+1)%1;

  blinkAt-=dt;
  if(blinkAt<=0){ blinkAt=2.4+Math.random()*3.4; blink=1; }
  blink=Math.max(0, blink-dt*7.5);
  nextTwitch-=dt;
  if(nextTwitch<=0){ nextTwitch=2.6+Math.random()*4; earTwitch=1; }
  earTwitch=Math.max(0, earTwitch-dt*5.5);

  if(HUMAN.ready) poseHuman(dt);
  placeCards(dt);
  stepRope(dt, reduced ? 0 : gust, effortS);
  stepParticles(dt);
  audioSample(dt);
  stepRings(dt);
}

/* =====================================================================
   BOOT
   ===================================================================== */
function build(){
  if(!layout()) return false;
  anchorL={ ...anchorBase };
  for(let i=0;i<90;i++){ if(HUMAN.ready) poseHuman(FIXED); placeCards(FIXED); stepRope(FIXED, 0.2, 0); }
  drawRope();
  renderer.render(scene, camera);
  ready=true;
  return true;
}
function init(){
  dots.forEach((d,i)=>d.setAttribute("aria-current", i===0?"true":"false"));
  announce(0);
  build();
  requestAnimationFrame(frame);
}
/* the stage can measure 0x0 (hidden tab, zero-width preview pane, late fonts): the observer
   both boots us late and keeps the geometry honest afterwards */
let rzT;
new ResizeObserver(() => {
  clearTimeout(rzT);
  rzT=setTimeout(() => {
    if(!ready){ build(); return; }
    const frac=step ? scroll/step : 0;
    if(!layout()) return;
    anchorL={ ...anchorBase };
    scroll=frac*step; target=Math.round(frac)*step; scrollV=0;
  }, 120);
}).observe(stage);

/* ---------- player controls ---------- */
const playBtn=document.getElementById("playBtn"), volEl=document.getElementById("vol");
function setPlaying(on){
  playBtn.setAttribute("aria-pressed", on ? "true":"false");
  playBtn.setAttribute("aria-label", on ? "Pause music" : "Play music");
  if(on) audioPlay(); else audioPause();
}
playBtn.addEventListener("click", () => setPlaying(!AUDIO.playing));
for(const b of document.querySelectorAll(".trk")){
  b.addEventListener("click", () => {
    for(const o of document.querySelectorAll(".trk")) o.setAttribute("aria-checked", o===b ? "true":"false");
    AUDIO.track = b.dataset.track;
    AUDIO.bpm = GROOVES[AUDIO.track].bpm;
    grooveStop();
    bedsPause(AUDIO.track);
    if(AUDIO.el && !bedEls[AUDIO.track]) AUDIO.el.pause();
    document.querySelector(".own span").textContent = "Your track";
    if(AUDIO.playing) audioPlay();
  });
}
document.getElementById("ownFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  for(const o of document.querySelectorAll(".trk")) o.setAttribute("aria-checked","false");
  playFile(f);
  setPlaying(true);
  document.querySelector(".own span").textContent = f.name.length>26 ? f.name.slice(0,24)+"…" : f.name;
});
volEl.addEventListener("input", () => { if(AUDIO.master) AUDIO.master.gain.value = volEl.value/100 * 0.9; });

/* the character arrives asynchronously; the scene runs without him until it does */
try {
  const bin = Uint8Array.from(atob(window.__PULLER_GLB_B64), c => c.charCodeAt(0)).buffer;
  new THREE.GLTFLoader().parse(bin, "", initHuman, err => console.error("puller failed to load", err));
} catch(err){ console.error("puller data missing", err); }

init();

/* Space Grotesk / Manrope load async — repaint the card canvases once they land, so the
   first frame isn't stuck with the fallback system font baked into the texture. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { if(ready) layout(); });
}
}
})();
</script>
