<svg xmlns="http://www.w3.org/2000/svg" width="9933" height="7016" viewBox="0 0 3364 2378"><rect width="3364" height="2378" fill="#f4f1e9"/><g font-family="Arial,Helvetica,sans-serif" fill="#242a2b"><text x="130" y="150" font-size="28" font-weight="700" letter-spacing="5">BUILDING AUTOPSY / SENIOR CONCEPT STUDY</text><text x="130" y="245" font-size="78" font-weight="700">Convert an abandoned factory into a boutique hotel</text><text x="130" y="300" font-size="28" fill="#5a6262">1912 textile factory · 54 × 24 m · 42 keys · three retained levels · concept only</text><rect x="130" y="380" width="1440" height="770" fill="#d7cec0" stroke="#242a2b" stroke-width="12"/><text x="180" y="450" font-size="32" font-weight="700">01 / EXISTING FABRIC</text><path d="M220 560H1460M220 690H1460M220 820H1460M220 950H1460M430 500V1080M640 500V1080M850 500V1080M1060 500V1080M1270 500V1080" stroke="#7e8682" stroke-width="4" stroke-dasharray="14 12"/><rect x="620" y="690" width="420" height="260" fill="none" stroke="#e86150" stroke-width="16" stroke-dasharray="25 15"/><text x="180" y="1110" font-size="24">6 × 4 grid / two retained stairs / cast-iron columns / brick perimeter</text><rect x="1660" y="380" width="1570" height="770" fill="#fffdf7" stroke="#5b3f35" stroke-width="12"/><text x="1710" y="450" font-size="32" font-weight="700" fill="#5b3f35">02 / INTERVENTION</text><rect x="2130" y="600" width="630" height="370" fill="#e9f2ea" stroke="#5b3f35" stroke-width="15"/><text x="2445" y="790" text-anchor="middle" font-size="38" font-weight="700" fill="#5b3f35">18 × 12 m ATRIUM</text><text x="2445" y="835" text-anchor="middle" font-size="22">bays 3–4 / B–C</text><text x="1710" y="1050" font-size="24">KEEP charcoal · REMOVE coral · ADD mint + bronze</text><text x="1710" y="1100" font-size="24">One removed column: 4/C. All atrium perimeter columns remain.</text><rect x="130" y="1260" width="1000" height="780" fill="#d7cec0" stroke="#242a2b" stroke-width="12"/><text x="180" y="1330" font-size="32" font-weight="700">03 / SECTION</text><path d="M200 1900V1450h150l40-50 40 50h170l40-50 40 50h170l40-50 40 50h180v450M200 1750h830M200 1600h830" fill="#d7cec0" stroke="#242a2b" stroke-width="15"/><rect x="500" y="1600" width="240" height="300" fill="#fffdf7" stroke="#5b3f35" stroke-width="12"/><text x="520" y="1740" font-size="23" fill="#5b3f35">ATRIUM VOID</text><rect x="1250" y="1260" width="1000" height="780" fill="#fffdf7" stroke="#242a2b" stroke-width="12"/><text x="1300" y="1330" font-size="32" font-weight="700">04 / PROGRAM</text><text x="1300" y="1420" font-size="28" font-weight="700">GROUND</text><text x="1300" y="1465" font-size="24">Reception · bar · restaurant · kitchen · staff · 2 accessible rooms</text><text x="1300" y="1555" font-size="28" font-weight="700">LEVELS 1 + 2</text><text x="1300" y="1600" font-size="24">20 rooms each · galleries around atrium · suites at ends</text><text x="1300" y="1690" font-size="28" font-weight="700">ENGINEERING NOTE</text><text x="1300" y="1735" font-size="24">Independent frame supports lantern and galleries. Licensed review required.</text><rect x="2370" y="1260" width="860" height="780" fill="#242a2b"/><text x="2420" y="1335" font-size="32" font-weight="700" fill="#f4f1e9">MATERIAL PALETTE</text><rect x="2420" y="1410" width="120" height="120" fill="#b95742"/><text x="2580" y="1485" font-size="25" fill="#f4f1e9">Existing red brick</text><rect x="2420" y="1580" width="120" height="120" fill="#5b3f35"/><text x="2580" y="1655" font-size="25" fill="#f4f1e9">Dark bronze frame</text><rect x="2420" y="1750" width="120" height="120" fill="#b8d7c6"/><text x="2580" y="1825" font-size="25" fill="#f4f1e9">Low-iron glass</text><text x="130" y="2230" font-size="22">CONCEPT STUDY ONLY — site survey, hazardous-material, structure, fire, access, MEP and conservation review required before construction.</text><text x="3230" y="2230" text-anchor="end" font-size="22" font-weight="700">A1 LANDSCAPE / 841 × 594 mm</text></g></svg>