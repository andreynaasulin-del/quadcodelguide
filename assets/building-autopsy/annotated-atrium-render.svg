<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200"><rect width="1920" height="1200" fill="#f4f1e9"/><g font-family="Arial,Helvetica,sans-serif" fill="#242a2b"><text x="100" y="90" font-size="22" font-weight="700" letter-spacing="3">BUILDING AUTOPSY / 08</text><text x="100" y="150" font-size="48" font-weight="700">Annotated atrium render</text><text x="100" y="188" font-size="20" fill="#5a6262">What the final image must prove: retained shell, clear void, independent frame and usable public life.</text></g><g transform="translate(230 270)"><rect width="1460" height="670" fill="#d7cec0" stroke="#242a2b" stroke-width="16"/><path d="M0 580H1460M0 375H1460" fill="none" stroke="#5b3f35" stroke-width="12"/><path d="M0 0l125 95 125-95 125 95 125-95 125 95 125-95 125 95 125-95 125 95 125-95 125 95 125-95" fill="none" stroke="#242a2b" stroke-width="18"/><rect x="560" y="50" width="340" height="520" fill="#fffdf7" stroke="#5b3f35" stroke-width="14"/><path d="M580 70h300l-30-60H610z" fill="#b8d7c6" stroke="#5b3f35" stroke-width="12"/><path d="M600 360h260M600 170h260" fill="none" stroke="#8d9c84" stroke-width="24"/><path d="M60 600h1340" fill="none" stroke="#4c5d54" stroke-width="25" stroke-dasharray="80 25"/><g fill="#5a6262"><circle cx="290" cy="560" r="18"/><circle cx="340" cy="560" r="18"/><circle cx="1080" cy="560" r="18"/><circle cx="1130" cy="560" r="18"/></g><g fill="#b8d7c6" stroke="#5b3f35" stroke-width="6"><rect x="640" y="510" width="60" height="40"/><rect x="760" y="510" width="60" height="40"/></g></g><g font-family="Arial,Helvetica,sans-serif" font-size="20"><g><path d="M260 400H80v-90" fill="none" stroke="#e86150" stroke-width="4"/><circle cx="260" cy="400" r="8" fill="#e86150"/><text x="80" y="275" font-weight="700" fill="#e86150">01 / RETAINED ROOF</text><text x="80" y="300">Sawtooth profile remains visible</text></g><g><path d="M900 320h360v-80" fill="none" stroke="#5b3f35" stroke-width="4"/><circle cx="900" cy="320" r="8" fill="#5b3f35"/><text x="1260" y="205" font-weight="700" fill="#5b3f35">02 / 1.5 m SETBACK</text><text x="1260" y="230">Set back 1.5 m from cut edges</text></g><g><path d="M1060 630h420v30" fill="none" stroke="#5b3f35" stroke-width="4"/><circle cx="1060" cy="630" r="8" fill="#5b3f35"/><text x="1480" y="685" font-weight="700" fill="#5b3f35">03 / GALLERY</text><text x="1480" y="710">2.0 m clear loop around void</text></g><g><path d="M870 820h-420v65" fill="none" stroke="#8d9c84" stroke-width="4"/><circle cx="870" cy="820" r="8" fill="#8d9c84"/><text x="80" y="915" font-weight="700" fill="#4c5d54">04 / PUBLIC FLOOR</text><text x="80" y="940">Oak, wool and planting soften the bar</text></g></g><text x="960" y="1120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5a6262">Render instruction: eye-level from the lobby, 35 mm lens, natural overcast daylight, real brick wear and no decorative clutter.</text></svg>