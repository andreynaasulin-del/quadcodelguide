<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200"><rect width="1920" height="1200" fill="#f4f1e9"/><g font-family="Arial,Helvetica,sans-serif" fill="#242a2b"><text x="100" y="90" font-size="22" font-weight="700" letter-spacing="3">BUILDING AUTOPSY / 06</text><text x="100" y="150" font-size="48" font-weight="700">North façade: before / after</text><text x="100" y="188" font-size="20" fill="#5a6262">Existing window rhythm retained; new intervention is legible but subordinate</text></g><g transform="translate(130 320)"><g><text x="0" y="-35" font-family="Arial" font-size="24" font-weight="700">BEFORE</text><rect x="0" y="0" width="720" height="420" fill="#b95742" stroke="#242a2b" stroke-width="9"/><path d="M0 140h720M0 280h720M120 0v420M240 0v420M360 0v420M480 0v420M600 0v420" stroke="#7b382d" stroke-width="5"/><g fill="#f4f1e9" stroke="#242a2b" stroke-width="6"><path d="M35 240v-90q25-55 50 0v90zM155 240v-90q25-55 50 0v90zM275 240v-90q25-55 50 0v90zM395 240v-90q25-55 50 0v90zM515 240v-90q25-55 50 0v90zM635 240v-90q25-55 50 0v90z"/></g></g><g transform="translate(920)"><text x="0" y="-35" font-family="Arial" font-size="24" font-weight="700" fill="#5b3f35">AFTER</text><rect x="0" y="0" width="720" height="420" fill="#b95742" stroke="#242a2b" stroke-width="9"/><path d="M0 140h720M0 280h720M120 0v420M240 0v420M360 0v420M480 0v420M600 0v420" stroke="#7b382d" stroke-width="5"/><g fill="#f4f1e9" stroke="#242a2b" stroke-width="6"><path d="M35 240v-90q25-55 50 0v90zM155 240v-90q25-55 50 0v90zM275 240v-90q25-55 50 0v90zM395 240v-90q25-55 50 0v90zM515 240v-90q25-55 50 0v90zM635 240v-90q25-55 50 0v90z"/></g><rect x="270" y="0" width="180" height="55" fill="#b8d7c6" stroke="#5b3f35" stroke-width="8"/><text x="360" y="95" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">SET-BACK LANTERN</text></g></g><g font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#242a2b"><text x="130" y="900">KEEP: red brick, arched window rhythm and sawtooth profile.</text><text x="130" y="940">ADD: a roof lantern only over bays 3–4; it reads above rather than across the historic façade.</text><text x="130" y="1020" font-size="17">Concept elevation. Verify conservation, waterproofing, fire and structure with licensed consultants.</text></g></svg>