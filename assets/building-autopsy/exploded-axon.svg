<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200"><rect width="1920" height="1200" fill="#f4f1e9"/><g font-family="Arial,Helvetica,sans-serif" fill="#242a2b"><text x="100" y="90" font-size="22" font-weight="700" letter-spacing="3">BUILDING AUTOPSY / 05</text><text x="100" y="150" font-size="48" font-weight="700">Exploded axonometry</text><text x="100" y="188" font-size="20" fill="#5a6262">Four layers clarify what survives, what is cut and what is added</text></g><g transform="translate(530 250) skewY(-22)"><g stroke="#242a2b" stroke-width="8"><rect x="0" y="530" width="820" height="270" fill="#d7cec0"/><rect x="0" y="350" width="820" height="270" fill="#d7cec0"/><rect x="0" y="170" width="820" height="270" fill="#d7cec0"/></g><g fill="#f4f1e9" stroke="#5b3f35" stroke-width="10"><rect x="280" y="350" width="270" height="270"/><rect x="280" y="170" width="270" height="270"/></g><g stroke="#e86150" stroke-width="10" stroke-dasharray="20 12" fill="none"><rect x="280" y="350" width="270" height="270"/><rect x="280" y="170" width="270" height="270"/></g><g fill="#b8d7c6" stroke="#5b3f35" stroke-width="10"><rect x="300" y="80" width="230" height="80"/><path d="M320 80h190l-20-70H340z"/></g><path d="M280 540v-420M550 540v-420" stroke="#5b3f35" stroke-width="12"/></g><g font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700"><text x="150" y="400">01 / RETAIN</text><text x="150" y="432" font-size="18" font-weight="400">Brick shell + iron grid</text><text x="150" y="500" fill="#e86150">02 / CUT</text><text x="150" y="532" font-size="18" font-weight="400">L1/L2 plates + roof</text><text x="1450" y="400" fill="#5b3f35">03 / FRAME</text><text x="1450" y="432" font-size="18" font-weight="400">Independent bronze steel</text><text x="1450" y="500" fill="#5b3f35">04 / LANTERN</text><text x="1450" y="532" font-size="18" font-weight="400">Glazed roof, 1.5m setback</text></g><text x="960" y="1085" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#242a2b">The void remains locked to bays 3–4 / B–C in every layer. Only grid point 4/C is removed.</text></svg>