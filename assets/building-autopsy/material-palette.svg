<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200"><rect width="1920" height="1200" fill="#f4f1e9"/><g font-family="Arial,Helvetica,sans-serif" fill="#242a2b"><text x="100" y="90" font-size="22" font-weight="700" letter-spacing="3">BUILDING AUTOPSY / 07</text><text x="100" y="150" font-size="48" font-weight="700">Material palette + visual rules</text><text x="100" y="188" font-size="20" fill="#5a6262">Existing fabric stays tactile. New work is quiet, precise and readable at every junction.</text></g><g transform="translate(100 290)"><g><rect width="360" height="420" fill="#b95742"/><path d="M0 70h360M0 140h360M0 210h360M0 280h360M0 350h360M90 0v70M270 0v70M45 70v70M225 70v70M90 140v70M270 140v70M45 210v70M225 210v70M90 280v70M270 280v70M45 350v70M225 350v70" stroke="#7b382d" stroke-width="10"/><text x="0" y="475" font-size="26" font-weight="700">01 / EXISTING BRICK</text><text x="0" y="515" font-size="19">Clean, repoint, repair. Do not paint.</text></g><g transform="translate(440)"><rect width="360" height="420" fill="#5b3f35"/><path d="M25 0v420M75 0v420M125 0v420M175 0v420M225 0v420M275 0v420M325 0v420" stroke="#795f50" stroke-width="5"/><text x="0" y="475" font-size="26" font-weight="700">02 / DARK BRONZE STEEL</text><text x="0" y="515" font-size="19">Independent frame; bolted, not concealed.</text></g><g transform="translate(880)"><rect width="360" height="420" fill="#b8d7c6" stroke="#5b3f35" stroke-width="10"/><path d="M0 100h360M0 210h360M0 320h360" stroke="#eef8f2" stroke-width="10" opacity=".8"/><text x="0" y="475" font-size="26" font-weight="700">03 / LOW-IRON GLASS</text><text x="0" y="515" font-size="19">Lantern and lift enclosure; no tint.</text></g><g transform="translate(1320)"><rect width="360" height="420" fill="#d7cec0"/><circle cx="95" cy="120" r="65" fill="#8d9c84"/><circle cx="220" cy="225" r="88" fill="#697468"/><path d="M0 350q100-100 200 0t160-10v80H0z" fill="#4c5d54"/><text x="0" y="475" font-size="26" font-weight="700">04 / OAK + WOOL</text><text x="0" y="515" font-size="19">Warmth inside the retained industrial shell.</text></g></g><g transform="translate(100 920)" font-family="Arial,Helvetica,sans-serif"><text x="0" y="0" font-size="24" font-weight="700" fill="#5b3f35">JUNCTION RULE</text><text x="0" y="45" font-size="20" fill="#242a2b">Every new element stops 25–50 mm short of historic brick. The shadow gap makes the intervention honest.</text><text x="0" y="105" font-size="24" font-weight="700" fill="#5b3f35">VISUAL HIERARCHY</text><text x="0" y="150" font-size="20" fill="#242a2b">Brick is the field. Bronze is the line. Glass is the light. Interior finishes never compete with the shell.</text></g></svg>