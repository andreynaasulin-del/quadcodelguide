<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 128px; overflow: hidden; position: relative; }
  .caption-bar {
    position: absolute; left: 0; top: 0; width: 1920px; height: 128px;
    background: linear-gradient(to top, rgba(10,8,6,0.78) 0%, rgba(10,8,6,0.55) 45%, rgba(10,8,6,0) 100%);
  }
  .caption-text {
    position: absolute; left: 56px; bottom: 34px; width: 1500px;
    font-family: Georgia, serif; font-style: italic; font-size: 20px;
    line-height: 1.5; color: #F4EFE6;
  }
  .caption-text b {
    font-style: normal; font-weight: 700; margin-right: 6px;
  }
</style>
</head>
<body>
  <div class="caption-bar"></div>
  <div class="caption-text"><b>Fig. 01 —</b>A watchmaker adjusts the escapement by hand, under a loupe and natural window light. Medium-format film emulation.</div>
</body>
</html>
